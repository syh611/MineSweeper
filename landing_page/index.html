<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>恋爱任务簿 - 下载与预览</title>
  <style>
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','PingFang SC',sans-serif;background:linear-gradient(180deg,#f7f9ff,#eef2fb);color:#1c2333}
    .wrap{max-width:760px;margin:0 auto;padding:24px 16px 48px}
    .card{background:rgba(255,255,255,.75);backdrop-filter:blur(14px);border-radius:24px;padding:20px;box-shadow:0 10px 32px rgba(66,80,124,.12);border:1px solid rgba(255,255,255,.7)}
    .hero{display:grid;grid-template-columns:1fr;gap:12px;text-align:center}
    h1{margin:4px 0 6px;font-size:28px}.sub{color:#5a6480}
    .shots{display:flex;gap:10px;overflow:auto;padding-bottom:6px}
    .shot{min-width:145px;height:280px;border-radius:22px;background:linear-gradient(145deg,#e4eaf8,#fafcff);display:flex;align-items:center;justify-content:center;color:#667}
    .btns{display:grid;gap:10px;margin-top:16px}
    .btn{display:block;text-decoration:none;text-align:center;padding:12px;border-radius:14px;font-weight:600}
    .android{background:#2f6bff;color:white}.ios{background:#0f172a;color:white}.web{background:#fff;color:#213;border:1px solid #dbe3ff}
    .tip{font-size:13px;color:#6f7890;margin-top:12px}
    .qr{display:flex;justify-content:center;margin-top:18px}
    .qr img{width:160px;height:160px;border-radius:12px;background:#fff;padding:8px}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card hero">
      <h1>恋爱任务簿</h1>
      <div class="sub">双人私密任务奖励 APP，完成任务收获专属爱的积分与仪式感。</div>
      <div class="shots">
        <div class="shot">任务页预览</div>
        <div class="shot">创建任务预览</div>
        <div class="shot">货币页预览</div>
      </div>
      <div class="btns">
        <a class="btn android" href="./downloads/app-release.apk">安卓版下载（APK）</a>
        <a class="btn ios" href="https://testflight.apple.com/join/your-code">iOS 安装说明 / TestFlight</a>
        <a class="btn web" href="./web/index.html">网页预览版（Web Demo）</a>
      </div>
      <div class="qr">
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=https://your-domain.com" alt="落地页二维码" />
      </div>
      <div class="tip">微信内若无法下载，请点击右上角“在浏览器打开”。</div>
    </div>
  </div>
</body>
</html>
